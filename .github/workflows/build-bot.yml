name: Build Bot

on:
  push:
    tags-ignore:
      - '*'
    paths:
      - 'apps/bot/**'
      - 'libs/shared-types/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
  pull_request:
    paths:
      - 'apps/bot/**'
      - 'libs/shared-types/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'

jobs:
  build-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bot
        run: npm run bot:build
